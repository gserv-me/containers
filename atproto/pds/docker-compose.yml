version: '3.9'
services:
  pds_caddy:
    container_name: pds_caddy
    image: caddy:2

    labels:
      # HTTP
      - "traefik.http.routers.pds-mercie_http.entrypoints=web"
      - "traefik.http.routers.pds-mercie_http.rule=Host(`pds.mercie.dev`)|| HostRegexp(`^.+\\.pds\\.mercie\\.dev$`)"
      - "traefik.http.routers.pds-mercie_http.middlewares=https"
      - "traefik.http.middlewares.https.redirectscheme.scheme=https"

      # HTTPS
      - "traefik.http.routers.pds-mercie.rule=Host(`pds.mercie.dev`)|| HostRegexp(`^.+\\.pds\\.mercie\\.dev$`)"
      - "traefik.http.routers.pds-mercie.entrypoints=websecure"
      - "traefik.http.routers.pds-mercie.tls.certresolver=letsencrypt-dns"
      - "traefik.http.routers.pds-mercie.tls.domains[0].main=pds.mercie.dev"
      - "traefik.http.routers.pds-mercie.tls.domains[0].sans=*.pds.mercie.dev"
      - "traefik.http.routers.pds-mercie.service=pds-mercie"

      # Load Balancer
      - "traefik.http.services.pds-mercie.loadbalancer.server.port=80"
      - "traefik.http.services.pds-mercie.loadbalancer.server.scheme=http"

    depends_on:
      - pds
      - activitypub

    networks:
      - pds
      - web

    restart: unless-stopped

    volumes:
      - type: bind
        source: /srv/pds/caddy/data
        target: /data

      - type: bind
        source: /srv/pds/caddy/etc
        target: /etc/caddy

  pds:
    container_name: pds
    image: ghcr.io/bluesky-social/pds:latest
    restart: unless-stopped

    networks:
      - pds

    environment:
      - PDS_JWT_SECRET
      - PDS_ADMIN_PASSWORD
      - PDS_EMAIL_SMTP_URL
      - PDS_EMAIL_FROM_ADDRESS
      - PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX

      - LOG_ENABLED=true
      - PDS_BLOB_UPLOAD_LIMIT=314572800
      - PDS_BLOBSTORE_DISK_LOCATION=/pds/blocks
      - PDS_BSKY_APP_VIEW_DID=did:web:api.bsky.app
      - PDS_BSKY_APP_VIEW_URL=https://api.bsky.app
      - PDS_CRAWLERS=https://bsky.network
      - PDS_DATA_DIRECTORY=/pds
      - PDS_DID_PLC_URL=https://plc.directory
      - PDS_HOSTNAME=pds.mercie.dev
      - PDS_INVITE_REQUIRED=true
      - PDS_RATE_LIMITS_ENABLED=true
      - PDS_REPORT_SERVICE_DID=did:plc:ar7c4by46qjdydhdevvrndac
      - PDS_REPORT_SERVICE_URL=https://mod.bsky.app

    volumes:
      - type: bind
        source: /srv/pds/data
        target: /pds

  activitypub:
    container_name: activitypub
    image: ghcr.io/msonnb/fedisky:latest

    networks:
      - pds

    restart: unless-stopped

    depends_on:
      pds:
        condition: service_healthy
        restart: true

    environment:
      # Service configuration
      - AP_PORT=3001
      - AP_HOSTNAME=pds.mercie.dev
      - AP_VERSION=0.0.1

      # PDS connection (reusing PDS credentials)
      - PDS_URL=http://pds:3000
      - PDS_ADMIN_TOKEN=${PDS_ADMIN_PASSWORD}
      - PDS_HOSTNAME=pds.mercie.dev

      # Database
      - AP_DB_LOCATION=/data/activitypub.sqlite

      # Firehose subscription
      - AP_FIREHOSE_ENABLED=true

      # Mastodon bridge account (auto-created on startup)
      - AP_MASTODON_BRIDGE_ENABLED=true
      - AP_MASTODON_BRIDGE_HANDLE=activitypub.mercie.dev
      - AP_MASTODON_BRIDGE_DISPLAY_NAME=ActivityPub Bridge
      - AP_MASTODON_BRIDGE_DESCRIPTION=This account relays replies from ActivityPub users when replying to accounts on pds.mercie.dev.

      # Bluesky bridge account (auto-created on startup)
      - AP_BLUESKY_BRIDGE_ENABLED=true
      - AP_BLUESKY_BRIDGE_HANDLE=atproto.mercie.dev
      - AP_BLUESKY_BRIDGE_DISPLAY_NAME=ATProto Bridge
      - AP_BLUESKY_BRIDGE_DESCRIPTION=This account relays replies from external ATProto users replying to proxied ActivityPub accounts on pds.mercie.dev.

      # Constellation (external reply discovery)
      - AP_CONSTELLATION_URL=https://constellation.microcosm.blue

    volumes:
      - type: bind
        source: /srv/pds/activitypub
        target: /data

networks:
  web:
    external: true

  pds:
    driver: bridge
    name: pds
